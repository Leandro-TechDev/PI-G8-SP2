<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Calculadora de Estoque de Vacinas</h1>

        <h2>Configurações do Estoque</h2>

        <div class="input-group-top">
            <div class="config-field">
                <label for="ipt_tipos">Tipos de vacina:</label>
                <input type="number" id="ipt_tipos" class="ipt-tipos" min="1" placeholder="Ex: 3">
            </div>
            
            <div class="config-field">
                <label for="ipt_perda">Porcentagem de perda (%):</label>
                <input type="number" id="ipt_perda" class="ipt-perda" min="0" max="100" step="0.1" placeholder="Ex: 5">
            </div>

            <button onclick="criarCampos()" class="btn-primary">Adicionar</button>
        </div>

        <div id="div_vacinas" class="cards-container"></div>

        <button onclick="calcularEstoque()" class="btn-primary btn-calc">Calcular estoque</button>

        <div id="resultado"></div>
    </div>

    <script>
        function criarCampos() {
            let tipos = Number(ipt_tipos.value);
            let mensagem = "";
            
            for (let i = 1; i <= tipos; i++) {
                mensagem += `
                    <div class="vaccine-card">
                        <div class="card-header">
                            Vacina ${i}
                        </div>
                        <div class="card-body">
                            <div class="field-group">
                                <label>Nome da vacina:</label>
                                <input type="text" id="nome_${i}" placeholder="Ex: Covid-19">
                            </div>
                            <div class="field-group">
                                <label>Quantidade:</label>
                                <input type="number" id="qtd_${i}" placeholder="0" min="0">
                            </div>
                            <div class="field-group">
                                <label>Valor unitário (R$):</label>
                                <input type="number" id="valor_${i}" step="0.01" placeholder="0.00" min="0">
                            </div>
                        </div>
                    </div>
                `;
            }

            div_vacinas.innerHTML = mensagem;
        }

        function calcularEstoque() {
            let tipos = Number(ipt_tipos.value);
            let pctPerda = Number(ipt_perda.value) || 0;

            if (tipos <= 0) return;

            let totalQuantidadeBruta = 0;
            let totalValorBruto = 0;
            let resumo = "";

            for (let i = 1; i <= tipos; i++) {
                let nome = document.getElementById(`nome_${i}`).value.trim();
                if (!nome) {
                    nome = `Vacina ${i}`;
                }

                let qtd = Number(document.getElementById(`qtd_${i}`).value);
                let valor = Number(document.getElementById(`valor_${i}`).value);

                let totalVacinaBruta = qtd * valor;

                totalQuantidadeBruta += qtd;
                totalValorBruto += totalVacinaBruta;

                resumo += `
                    <div class="result-item">
                        <b>${nome}:</b> ${qtd.toLocaleString('pt-BR')} un. | 
                        <b>Valor Unitário:</b> R$ ${valor.toFixed(2)} | 
                        <b>Total:</b> R$ ${totalVacinaBruta.toFixed(2)}
                    </div>
                `;
            }

            // Cálculos da perda
            let quantidadePerdida = totalQuantidadeBruta * (pctPerda / 100);
            let quantidadeLiquida = totalQuantidadeBruta - quantidadePerdida;

            let valorPerdido = totalValorBruto * (pctPerda / 100);
            let valorLiquido = totalValorBruto - valorPerdido;

            resultado.innerHTML = `
                <div class="result-box">
                    ${resumo}
                    <div class="result-totals">
                        <p><b>Quantidade Bruta:</b> ${totalQuantidadeBruta.toLocaleString('pt-BR')} unidades</p>
                        <p><b>Valor Bruto Total:</b> R$ ${totalValorBruto.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
                        
                        <hr class="divider">

                        <p><b>Perda estimada (${pctPerda}%):</b> 
                            <span class="loss">- ${quantidadePerdida.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} un. 
                            (R$ ${valorPerdido.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })})</span>
                        </p>

                        <p><b>Quantidade Líquida Disponível:</b> <span class="highlight">${quantidadeLiquida.toLocaleString('pt-BR', { maximumFractionDigits: 2 })} unidades</span></p>
                        <p><b>Valor Líquido do Estoque:</b> <span class="highlight">R$ ${valorLiquido.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span></p>
                    </div>
                </div>
            `;
        }
    </script>

</body>

</html>
