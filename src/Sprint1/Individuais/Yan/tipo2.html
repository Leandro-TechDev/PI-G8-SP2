<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Estoque</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="container">
        <h1>Calculadora de Estoque de Vacinas</h1>

        <h2>Configuração Inicial</h2>

        <div class="input-group-top">
            <div class="top-field">
                <label for="ipt_tipos">Tipos de Vacina (1 a 5):</label>
                <input type="number" id="ipt_tipos" class="ipt-tipos" placeholder="1 a 5">
            </div>
            
            <div class="top-field">
                <label for="ipt_perda">Porcentagem de Perda (%):</label>
                <div class="perda-container">
                    <input type="number" id="ipt_perda" class="ipt-perda" placeholder="Ex: 5" step="0.1">
                    <button type="button" onclick="usarPerdaPadrao()" class="btn-secondary" title="Clique caso não saiba a porcentagem de perda">
                        Não sei minha perda (41%)
                    </button>
                </div>
            </div>

            <button onclick="criarCampos()" class="btn-primary">Adicionar</button>
        </div>

        <div id="div_vacinas" class="cards-container"></div>

        <button onclick="calcularEstoque()" class="btn-primary btn-calc">Calcular estoque</button>

        <div id="resultado"></div>
    </div>

    <script>
        // Função para preencher automaticamente a perda de 41%
        function usarPerdaPadrao() {
            ipt_perda.value = 41;
        }

        function criarCampos() {
            let tipos = Number(ipt_tipos.value);
            let mensagem = "";

            let card1 = `
                <div class="vaccine-card">
                    <div class="card-header">Vacina 1</div>
                    <div class="card-body">
                        <div class="field-group">
                            <label>Nome da Vacina:</label>
                            <input type="text" id="nome_1" placeholder="Ex: Coronavac">
                        </div>
                        <div class="field-group">
                            <label>Quantidade:</label>
                            <input type="number" id="qtd_1" placeholder="0">
                        </div>
                        <div class="field-group">
                            <label>Valor unitário (R$):</label>
                            <input type="number" id="valor_1" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                </div>
            `;

            let card2 = `
                <div class="vaccine-card">
                    <div class="card-header">Vacina 2</div>
                    <div class="card-body">
                        <div class="field-group">
                            <label>Nome da Vacina:</label>
                            <input type="text" id="nome_2" placeholder="Ex: Pfizer">
                        </div>
                        <div class="field-group">
                            <label>Quantidade:</label>
                            <input type="number" id="qtd_2" placeholder="0">
                        </div>
                        <div class="field-group">
                            <label>Valor unitário (R$):</label>
                            <input type="number" id="valor_2" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                </div>
            `;

            let card3 = `
                <div class="vaccine-card">
                    <div class="card-header">Vacina 3</div>
                    <div class="card-body">
                        <div class="field-group">
                            <label>Nome da Vacina:</label>
                            <input type="text" id="nome_3" placeholder="Ex: AstraZeneca">
                        </div>
                        <div class="field-group">
                            <label>Quantidade:</label>
                            <input type="number" id="qtd_3" placeholder="0">
                        </div>
                        <div class="field-group">
                            <label>Valor unitário (R$):</label>
                            <input type="number" id="valor_3" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                </div>
            `;

            let card4 = `
                <div class="vaccine-card">
                    <div class="card-header">Vacina 4</div>
                    <div class="card-body">
                        <div class="field-group">
                            <label>Nome da Vacina:</label>
                            <input type="text" id="nome_4" placeholder="Ex: Janssen">
                        </div>
                        <div class="field-group">
                            <label>Quantidade:</label>
                            <input type="number" id="qtd_4" placeholder="0">
                        </div>
                        <div class="field-group">
                            <label>Valor unitário (R$):</label>
                            <input type="number" id="valor_4" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                </div>
            `;

            let card5 = `
                <div class="vaccine-card">
                    <div class="card-header">Vacina 5</div>
                    <div class="card-body">
                        <div class="field-group">
                            <label>Nome da Vacina:</label>
                            <input type="text" id="nome_5" placeholder="Ex: Influenza">
                        </div>
                        <div class="field-group">
                            <label>Quantidade:</label>
                            <input type="number" id="qtd_5" placeholder="0">
                        </div>
                        <div class="field-group">
                            <label>Valor unitário (R$):</label>
                            <input type="number" id="valor_5" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                </div>
            `;

            if (tipos == 1) {
                mensagem = card1;
            } else if (tipos == 2) {
                mensagem = card1 + card2;
            } else if (tipos == 3) {
                mensagem = card1 + card2 + card3;
            } else if (tipos == 4) {
                mensagem = card1 + card2 + card3 + card4;
            } else if (tipos == 5) {
                mensagem = card1 + card2 + card3 + card4 + card5;
            } else {
                mensagem = `<p class="error-message">Digite uma quantidade entre 1 e 5.</p>`;
            }

            div_vacinas.innerHTML = mensagem;
            resultado.innerHTML = "";
        }

        function calcularEstoque() {
            let tipos = Number(ipt_tipos.value);
            let percentualPerda = Number(ipt_perda.value);

            let totalQuantidade = 0;
            let totalValorBruto = 0;
            let resumo = "";

            if (tipos == 1) {
                let n1 = nome_1.value;
                if (n1 == "") { n1 = "Vacina 1"; }
                let q1 = Number(qtd_1.value);
                let v1 = Number(valor_1.value);
                let total1 = q1 * v1;

                totalQuantidade = q1;
                totalValorBruto = total1;

                resumo = `<div class="result-item"><b>${n1}:</b> ${q1} unidades | <b>Valor Unitário:</b> R$ ${v1.toFixed(2)} | <b>Subtotal:</b> R$ ${total1.toFixed(2)}</div>`;

            } else if (tipos == 2) {
                let n1 = nome_1.value;
                if (n1 == "") { n1 = "Vacina 1"; }
                let q1 = Number(qtd_1.value);
                let v1 = Number(valor_1.value);
                let total1 = q1 * v1;

                let n2 = nome_2.value;
                if (n2 == "") { n2 = "Vacina 2"; }
                let q2 = Number(qtd_2.value);
                let v2 = Number(valor_2.value);
                let total2 = q2 * v2;

                totalQuantidade = q1 + q2;
                totalValorBruto = total1 + total2;

                resumo = `
                    <div class="result-item"><b>${n1}:</b> ${q1} unidades | <b>Valor Unitário:</b> R$ ${v1.toFixed(2)} | <b>Subtotal:</b> R$ ${total1.toFixed(2)}</div>
                    <div class="result-item"><b>${n2}:</b> ${q2} unidades | <b>Valor Unitário:</b> R$ ${v2.toFixed(2)} | <b>Subtotal:</b> R$ ${total2.toFixed(2)}</div>
                `;

            } else if (tipos == 3) {
                let n1 = nome_1.value;
                if (n1 == "") { n1 = "Vacina 1"; }
                let q1 = Number(qtd_1.value);
                let v1 = Number(valor_1.value);
                let total1 = q1 * v1;

                let n2 = nome_2.value;
                if (n2 == "") { n2 = "Vacina 2"; }
                let q2 = Number(qtd_2.value);
                let v2 = Number(valor_2.value);
                let total2 = q2 * v2;

                let n3 = nome_3.value;
                if (n3 == "") { n3 = "Vacina 3"; }
                let q3 = Number(qtd_3.value);
                let v3 = Number(valor_3.value);
                let total3 = q3 * v3;

                totalQuantidade = q1 + q2 + q3;
                totalValorBruto = total1 + total2 + total3;

                resumo = `
                    <div class="result-item"><b>${n1}:</b> ${q1} unidades | <b>Valor Unitário:</b> R$ ${v1.toFixed(2)} | <b>Subtotal:</b> R$ ${total1.toFixed(2)}</div>
                    <div class="result-item"><b>${n2}:</b> ${q2} unidades | <b>Valor Unitário:</b> R$ ${v2.toFixed(2)} | <b>Subtotal:</b> R$ ${total2.toFixed(2)}</div>
                    <div class="result-item"><b>${n3}:</b> ${q3} unidades | <b>Valor Unitário:</b> R$ ${v3.toFixed(2)} | <b>Subtotal:</b> R$ ${total3.toFixed(2)}</div>
                `;

            } else if (tipos == 4) {
                let n1 = nome_1.value;
                if (n1 == "") { n1 = "Vacina 1"; }
                let q1 = Number(qtd_1.value);
                let v1 = Number(valor_1.value);
                let total1 = q1 * v1;

                let n2 = nome_2.value;
                if (n2 == "") { n2 = "Vacina 2"; }
                let q2 = Number(qtd_2.value);
                let v2 = Number(valor_2.value);
                let total2 = q2 * v2;

                let n3 = nome_3.value;
                if (n3 == "") { n3 = "Vacina 3"; }
                let q3 = Number(qtd_3.value);
                let v3 = Number(valor_3.value);
                let total3 = q3 * v3;

                let n4 = nome_4.value;
                if (n4 == "") { n4 = "Vacina 4"; }
                let q4 = Number(qtd_4.value);
                let v4 = Number(valor_4.value);
                let total4 = q4 * v4;

                totalQuantidade = q1 + q2 + q3 + q4;
                totalValorBruto = total1 + total2 + total3 + total4;

                resumo = `
                    <div class="result-item"><b>${n1}:</b> ${q1} unidades | <b>Valor Unitário:</b> R$ ${v1.toFixed(2)} | <b>Subtotal:</b> R$ ${total1.toFixed(2)}</div>
                    <div class="result-item"><b>${n2}:</b> ${q2} unidades | <b>Valor Unitário:</b> R$ ${v2.toFixed(2)} | <b>Subtotal:</b> R$ ${total2.toFixed(2)}</div>
                    <div class="result-item"><b>${n3}:</b> ${q3} unidades | <b>Valor Unitário:</b> R$ ${v3.toFixed(2)} | <b>Subtotal:</b> R$ ${total3.toFixed(2)}</div>
                    <div class="result-item"><b>${n4}:</b> ${q4} unidades | <b>Valor Unitário:</b> R$ ${v4.toFixed(2)} | <b>Subtotal:</b> R$ ${total4.toFixed(2)}</div>
                `;

            } else if (tipos == 5) {
                let n1 = nome_1.value;
                if (n1 == "") { n1 = "Vacina 1"; }
                let q1 = Number(qtd_1.value);
                let v1 = Number(valor_1.value);
                let total1 = q1 * v1;

                let n2 = nome_2.value;
                if (n2 == "") { n2 = "Vacina 2"; }
                let q2 = Number(qtd_2.value);
                let v2 = Number(valor_2.value);
                let total2 = q2 * v2;

                let n3 = nome_3.value;
                if (n3 == "") { n3 = "Vacina 3"; }
                let q3 = Number(qtd_3.value);
                let v3 = Number(valor_3.value);
                let total3 = q3 * v3;

                let n4 = nome_4.value;
                if (n4 == "") { n4 = "Vacina 4"; }
                let q4 = Number(qtd_4.value);
                let v4 = Number(valor_4.value);
                let total4 = q4 * v4;

                let n5 = nome_5.value;
                if (n5 == "") { n5 = "Vacina 5"; }
                let q5 = Number(qtd_5.value);
                let v5 = Number(valor_5.value);
                let total5 = q5 * v5;

                totalQuantidade = q1 + q2 + q3 + q4 + q5;
                totalValorBruto = total1 + total2 + total3 + total4 + total5;

                resumo = `
                    <div class="result-item"><b>${n1}:</b> ${q1} unidades | <b>Valor Unitário:</b> R$ ${v1.toFixed(2)} | <b>Subtotal:</b> R$ ${total1.toFixed(2)}</div>
                    <div class="result-item"><b>${n2}:</b> ${q2} unidades | <b>Valor Unitário:</b> R$ ${v2.toFixed(2)} | <b>Subtotal:</b> R$ ${total2.toFixed(2)}</div>
                    <div class="result-item"><b>${n3}:</b> ${q3} unidades | <b>Valor Unitário:</b> R$ ${v3.toFixed(2)} | <b>Subtotal:</b> R$ ${total3.toFixed(2)}</div>
                    <div class="result-item"><b>${n4}:</b> ${q4} unidades | <b>Valor Unitário:</b> R$ ${v4.toFixed(2)} | <b>Subtotal:</b> R$ ${total4.toFixed(2)}</div>
                    <div class="result-item"><b>${n5}:</b> ${q5} unidades | <b>Valor Unitário:</b> R$ ${v5.toFixed(2)} | <b>Subtotal:</b> R$ ${total5.toFixed(2)}</div>
                `;

            } else {
                resultado.innerHTML = `<p class="error-message">Digite uma quantidade entre 1 e 5.</p>`;
                return;
            }

            let valorPerda = totalValorBruto * (percentualPerda / 100);
            let totalValorLiquido = totalValorBruto - valorPerda;

            resultado.innerHTML = `
                <div class="result-box">
                    ${resumo}
                    <div class="result-totals">
                        <p class="total-qty"><b>Quantidade total:</b> ${totalQuantidade} doses</p>
                        <p class="total-val-bruto"><b>Valor total bruto:</b> R$ ${totalValorBruto.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
                        <p class="total-loss"><b>Perda estimada (${percentualPerda}%):</b> - R$ ${valorPerda.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
                        <p class="total-val-liquido"><b>Valor líquido do estoque:</b> R$ ${totalValorLiquido.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>
                    </div>
                </div>
            `;
        }
    </script>

</body>

</html>
