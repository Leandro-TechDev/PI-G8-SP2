<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
insira a quantidade de medicamentos do seu estoque: <input id="idEstoque"> <br>
ao longo do ano, quantas vezes sua geladeira falha?: <input id="idg"> <br>
quanto tempo essas falhas permaneceram? <input id="idFalhas"> <br>
o tempo médio que o medicamento costuma perder a validade? <input id="idValidade"><br>
ensira o valor médio dessa vacina <input id="id_valor">
<div id="div_exibir"></div>
<button onclick="personalizado()">calcule o preço com valores personalizados:</button> <br>
</body>
<script>
    function personalizado() {
    let quantidade = Number(idEstoque.value)
    let falhas = Number(idFalhas.value)
    let tempo= Number(idValidade.value)
    let tempo_total = 0
    let valor = Number(id_valor.value)
    if (falhas > tempo){
    tempo_total = (tempo - falhas)
    let estimativa_porcent = tempo_total * 10 * -1
    let estimativa = (estimativa_porcent/100) * quantidade
    let perda = estimativa * valor
    div_exibir.innerHTML = `estima-se que tenha uma perda de ${estimativa_porcent}% de vacinas
    oque causa um custo de R$ ${perda}, custando aprocimadamente ${estimativa}
    de vacinas por falha`
    }
    }

</script>
</html>
