<!DOCTYPE html> 
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Prejuízo - Vacinas</title>
    <style>
        body {
            font-family: sans-serif; 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 20px;
        }

        input, button {
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
        }

        button {
            background-color: #0056b3; 
            color: white; 
            border: none;
            font-weight: bold;
        }

        #div_msg {
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Simulador Financeiro: Monitoramento de Vacinas</h1>
    <p>Calcule o impacto financeiro da falta de monitoramento térmico em unidades refrigeradas.</p>

    <label>Quantas unidades refrigeradas (geladeiras) sua rede possui?</label><br>
    <input type="number" id="ipt_qtd_geladeiras" min="1"><br><br>

    <label>Qual o valor médio em vacinas armazenadas por unidade? (R$)</label><br>
    <input type="number" id="ipt_valor_vacinas" min="1"><br><br>

    <button onclick="calcularImpacto()">Calcular Impacto Financeiro</button>

    <div id="div_msg" style="margin-top: 20px;"></div>

    <script>
        function calcularImpacto() {
            let qtdGeladeiras = Number(ipt_qtd_geladeiras.value);
            let valorPorGeladeira = Number(ipt_valor_vacinas.value);

            if (qtdGeladeiras <= 0 || valorPorGeladeira <= 0) {
                div_msg.innerHTML = "<b>Por favor, insira valores válidos maiores que zero.</b>";
                return;
            }

            let valorTotalEstoque = qtdGeladeiras * valorPorGeladeira;

            // 41,4% dos incidentes de alteração de temperatura resultam em perda definitiva
            let prejuizoEstimado = valorTotalEstoque * 0.414; 

            // Custo da solução baseado no valor aproximado por unidade do projeto
            let custoArduinoAnual = qtdGeladeiras * 1385;

            let economiaGerada = prejuizoEstimado - custoArduinoAnual;

            let mensagem = `
                <h2>Resultados da Análise</h2>
                <b>Valor Total em Estoque:</b> R$ ${valorTotalEstoque.toFixed(2)}<br>
                <b>Prejuízo Estimado por Falha Térmica (41,4%):</b> R$ ${prejuizoEstimado.toFixed(2)}<br>
                <b>Custo Anual da Solução IoT (Arduino):</b> R$ ${custoArduinoAnual.toFixed(2)}<br><br>
            `;

            if (economiaGerada > 0) {
                mensagem += `
                    <h3 style="color: green;">Economia Potencial com a Solução: R$ ${economiaGerada.toFixed(2)}</h3>
                    <p><i>O retorno do investimento (Payback) costuma ocorrer em menos de 1 mês!</i></p>
                `;
            } else {
                mensagem += `
                    <h3 style="color: red;">Atenção: Para estoques muito baixos, o custo da tecnologia pode superar o da perda imediata, porém as multas da ANVISA podem chegar a R$ 1,5 milhão.</h3>
                `;
            }

            div_msg.innerHTML = mensagem;
        }
    </script>
</body>
</html>
