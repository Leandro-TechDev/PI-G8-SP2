<html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Risco de Estoque</title>
    <style>
        /* Estilo geral da página */
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Caixa principal centralizada */
        .container {
            background-color: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 8px;
            border-top: 5px solid #008080;
        }

        /* Títulos */
        h1 {
            color: #333333;
            font-size: 22px;
            text-align: center;
        }

        h2 {
            color: #555555;
            font-size: 16px;
            margin-top: 15px;
        }

        h3 {
            color: #008080;
            font-size: 16px;
            margin-top: 15px;
            border-bottom: 1px solid #ccc;
        }

        /* Rótulos e Campos de entrada */
        label {
            display: block;
            margin-top: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o input não passe da borda */
        }

        /* Botões */
        button {
            width: 100%;
            background-color: #008080;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            margin-top: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Área de resultado */
        #resultado {
            background-color: #e6f2f2;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            color: #004d4d;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Calculadora de Estoque e Risco de Vacinas</h1>

        <h2>Quantos lotes de vacina estão na câmara fria?</h2>

        <input type="number" id="ipt_lotes" placeholder="Digite a quantidade de lotes">
        <button onclick="criarCampos()">Gerar Lotes</button>

        <div id="div_lotes"></div>

        <button onclick="calcularEstoque()">Calcular Estoque em Risco</button>

        <h2 id="resultado"></h2>
    </div>



<script>

    function criarCampos() {
        let lotes = Number(ipt_lotes.value);
        let mensagem = "";

        for (let i = 1; i <= lotes; i++) {
            mensagem += `
                <h3>Lote ${i}</h3>

                <label>Nome da Vacina:</label>
                <input type="text" id="nome_${i}" placeholder="Ex: Gripe, COVID">

                <label>Qtd. Frascos:</label>
                <input type="number" id="qtd_${i}">

                <label>Valor por Frasco (R$):</label>
                <input type="number" id="valor_${i}" step="0.01">
            `;
        }

        div_lotes.innerHTML = mensagem;
    }

    function calcularEstoque() {
        let lotes = Number(ipt_lotes.value);
        let totalFrascos = 0;
        let valorTotalRisco = 0;

        for (let i = 1; i <= lotes; i++) {
            let qtd = Number(document.getElementById(`qtd_${i}`).value);
            let valor = Number(document.getElementById(`valor_${i}`).value);

            totalFrascos += qtd;
            valorTotalRisco += (qtd * valor);
        }

        resultado.innerHTML = `
            Total de Frascos Armazenados: <b>${totalFrascos}</b> unidades.<br>
            Valor Total do Estoque em Risco: <b>R$ ${valorTotalRisco.toFixed(2)}</b>
        `;
    }

</script>

</body></html>
